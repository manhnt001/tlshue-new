<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Quản trị Nội dung - Di sản Cố đô Huế</title>
  <!-- Include Netlify Identity for Authentication -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script
    src="https://unpkg.com/decap-cms-media-library-cloudinary@3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Initialize Cloudinary -->
  <script>
    CMS.registerMediaLibrary(window.Cloudinary);
  </script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Tự động thu gọn tất cả các danh sách sau khi Publish thành công
    CMS.registerEventListener({
      name: 'postSave',
      handler: () => {
        setTimeout(() => {
          window.location.reload();
        }, 1200);
      }
    });

    // Tự động tải lại trang khi người dùng ấn nút "Quay lại" (Back) 
    // từ trang sửa bài viết ra ngoài danh sách bài viết
    window.addEventListener('hashchange', (event) => {
      const oldHash = new URL(event.oldURL).hash;
      const newHash = new URL(event.newURL).hash;
      
      // Nếu vừa đi từ trang sửa bài (có chữ /entries/) ra ngoài trang danh sách (panels)
      if (oldHash.includes('/entries/') && newHash.startsWith('#/collections/panels')) {
        window.location.reload();
      }
    });
  </script>
</body>

</html>
